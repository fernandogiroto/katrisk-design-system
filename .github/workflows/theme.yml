name: Generate PrimeVue Theme from Tokens

on:
  push:
    paths:
      - "tokens.json"

permissions:
  contents: write

jobs:
  generate-theme:
    name: Build KatRisk Theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run theme builder
        run: node build-theme.js

      - name: Commit generated theme
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ./katrisk-theme
          git diff --cached --quiet || git commit -m "chore: update katrisk-theme from tokens"
          git push
